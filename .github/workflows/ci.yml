name: CaseDesk checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements-lock.txt
      - run: ../.venv/bin/python -m pytest -q
        working-directory: backend
      - run: ../.venv/bin/python evaluate.py
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            frontend/output/playwright/report/
            frontend/output/playwright/results/
            backend/evidence/eval-demo.json
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: python3 scripts/container-smoke.py
      - run: docker compose restart backend
      - run: python3 scripts/container-smoke.py --verify
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
